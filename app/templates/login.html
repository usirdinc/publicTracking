{% extends "base.html" %}
{% block title %}Log in · USIRD Case Tracker{% endblock %}
{% block content %}
<section class="auth">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to see your cases.</p>
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Email <input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
      <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn lg block">Log in</button>
    </form>
  </div>
  <p class="center muted mt">New here? <a href="/signup">Create an account</a></p>
</section>
{% endblock %}
