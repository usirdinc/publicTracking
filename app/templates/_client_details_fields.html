<fieldset data-intake-step data-step-key="Applicant" data-step-label="{{ _("Applicant") }}">
  <legend tabindex="-1">{{ _("Who are you tracking?") }}</legend>
  <p class="hint">{{ _("Use the primary applicant’s name as it appears on the application.") }}</p>
  <div class="intake-fields">
    <label>{{ _("First name") }} <input data-intake-field name="first_name" autocapitalize="words" required maxlength="100" autocomplete="given-name" placeholder="{{ _("First name") }}" value="{{ details.first_name or '' }}"></label>
    <label>{{ _("Last name") }} <input data-intake-field name="last_name" autocapitalize="words" required maxlength="100" autocomplete="family-name" placeholder="{{ _("Last name") }}" value="{{ details.last_name or '' }}"></label>
  </div>
</fieldset>
<fieldset data-intake-step data-step-key="Birthday" data-step-label="{{ _("Birthday") }}">
  <legend tabindex="-1">{{ _("When were they born?") }}</legend>
  <div class="intake-fields">
    <label>{{ _("Date of birth") }} <input id="birth-date" data-intake-field type="date" name="dob" required autocomplete="bday" value="{{ details.dob or '' }}"></label>
  </div>
</fieldset>
