{% extends "base.html" %}
{% block title %}Create account · USIRD Case Tracker{% endblock %}
{% block content %}
<section class="auth">
  <div class="card">
    <h1>Create your account</h1>
    <p class="sub">Start tracking your asylum fee and USCIS case in minutes.</p>
    <form method="post" action="/signup">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Email <input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
      <label>Password <input type="password" name="password" minlength="10" required autocomplete="new-password" placeholder="At least 10 characters"></label>
      <label class="check"><input type="checkbox" name="agree" value="1" required> <span>I agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</span></label>
      <button class="btn lg block">Create account</button>
    </form>
  </div>
  <p class="center muted mt">Already have an account? <a href="/login">Log in</a></p>
</section>
{% endblock %}
